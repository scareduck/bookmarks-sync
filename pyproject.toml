[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmarks-sync"
version = "0.1.0"
description = "Transform Firefox bookmark export HTML into a cleaner Safari import file"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
bookmarks-sync = "bookmarks_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
